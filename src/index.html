<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <title>spartan/ui agoge</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="spartan.svg" />

    <!-- Tints the iOS Safari address bar / safe areas; kept in sync below. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      if (typeof window !== 'undefined' && typeof document !== 'undefined') {
        const theme = localStorage.getItem('theme');

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

        // Match the iOS browser chrome to the resolved theme before first paint.
        const isDark = document.documentElement.classList.contains('dark');
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', isDark ? '#0a0a0a' : '#ffffff');
        }
      }
    </script>
  </head>
  <body class="[--header-height:--spacing(14)]">
    <spartan-root></spartan-root>
  </body>
</html>
